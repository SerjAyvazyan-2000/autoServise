<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Автосервис</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
/* ===== Переменные темы: меняйте акцент одной строкой ===== */
:root{
  --bg:#121315; --bg2:#1a1c1f; --line:#2c2f34;
  --text:#f4f4f5; --muted:#a0a4ab;
  --accent:#ff5a1f; --glow:0 0 0 1px var(--accent),0 10px 40px rgba(255,90,31,.35);
  --h:'Montserrat',sans-serif; --b:'Roboto',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{background:var(--bg);color:var(--text);font:400 16px/1.6 var(--b)}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
section{padding:90px 0}
h1,h2,h3{font-family:var(--h);font-weight:800;line-height:1.15}
h2{font-size:clamp(28px,4vw,42px);margin-bottom:12px}
.lead{color:var(--muted);max-width:560px;margin-bottom:44px}

/* Кнопки */
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border:2px solid var(--accent);
  background:var(--accent);color:#fff;font:800 14px var(--h);letter-spacing:.04em;cursor:pointer;
  transition:.25s;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
.btn:hover{background:transparent;color:var(--accent)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.sm{padding:10px 18px;font-size:13px}

/* ===== Header ===== */
header{position:fixed;inset:0 0 auto;z-index:50;background:rgba(18,19,21,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{display:flex;align-items:center;gap:10px;font:900 20px var(--h)}
.logo i{color:var(--accent);font-size:24px}
nav ul{display:flex;gap:30px;list-style:none}
nav a{font:700 14px var(--h);color:var(--muted);transition:.2s}
nav a:hover{color:var(--accent)}
.burger{display:none;background:none;border:0;color:var(--text);font-size:24px;cursor:pointer}

/* ===== Hero ===== */
.hero{min-height:100vh;display:flex;align-items:center;padding-top:68px;position:relative;
  background:linear-gradient(90deg,rgba(18,19,21,.95) 25%,rgba(18,19,21,.35)),var(--hero) center/cover}
.hero h1{font-size:clamp(36px,7vw,76px);font-weight:900;max-width:820px;margin-bottom:20px}
.hero p{font-size:18px;color:#cfd1d5;max-width:520px;margin-bottom:32px}
.hero .row{display:flex;gap:14px;flex-wrap:wrap}
.stripe{width:90px;height:6px;background:var(--accent);margin-bottom:24px}

/* ===== Услуги ===== */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.card{background:var(--bg2);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;transition:.3s}
.card:hover{transform:translateY(-8px);box-shadow:var(--glow);border-color:var(--accent)}
.card img{height:190px;width:100%;object-fit:cover;filter:grayscale(.4);transition:.3s}
.card:hover img{filter:none}
.card .body{padding:22px;display:flex;flex-direction:column;flex:1;gap:10px}
.card h3{font-size:20px}
.card p{color:var(--muted);font-size:15px;flex:1}
.price{font:800 22px var(--h);color:var(--accent)}
.card .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}

/* ===== Преимущества ===== */
#about{background:var(--bg2);border-block:1px solid var(--line)}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:30px}
.why div{padding-left:20px;border-left:3px solid var(--accent)}
.why i{font-size:30px;color:var(--accent);margin-bottom:14px}
.why h3{font-size:19px;margin-bottom:6px}
.why p{color:var(--muted);font-size:15px}

/* ===== Галерея ===== */
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.gallery div{position:relative;overflow:hidden;aspect-ratio:4/3;background:var(--bg2)}
.gallery img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.gallery div:hover img{transform:scale(1.08)}
.gallery span{position:absolute;left:0;bottom:0;padding:8px 16px;background:var(--accent);font:800 13px var(--h)}

/* ===== Контакты ===== */
.contacts{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
.info{list-style:none;display:grid;gap:18px}
.info li{display:flex;gap:16px;align-items:flex-start}
.info i{color:var(--accent);width:22px;font-size:20px;margin-top:3px}
.info small{display:block;color:var(--muted)}
.cta{background:var(--bg2);border:1px solid var(--line);padding:32px;display:grid;gap:14px}
.cta .btn{justify-content:center}
.sos{background:#d62828;border-color:#d62828}
.sos:hover{color:#ff6b6b;border-color:#ff6b6b}
footer{border-top:1px solid var(--line);padding:24px 0;text-align:center;color:var(--muted);font-size:14px}

/* ===== Адаптивность ===== */
@media(max-width:860px){
  section{padding:64px 0}
  .burger{display:block}
  nav{position:absolute;top:68px;left:0;right:0;background:var(--bg);border-bottom:1px solid var(--line);
    max-height:0;overflow:hidden;transition:max-height .35s}
  nav.open{max-height:420px}
  nav ul{flex-direction:column;gap:0;padding:10px 20px}
  nav li a{display:block;padding:14px 0;border-bottom:1px solid var(--line)}
  header .btn.sm{display:none}
  .contacts{grid-template-columns:1fr}
  .hero{background:linear-gradient(rgba(18,19,21,.8),rgba(18,19,21,.8)),var(--hero) center/cover}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>

<!-- ===== HEADER ===== -->
<header>
  <div class="wrap nav">
    <a href="#top" class="logo"><i class="fa-solid fa-car-side"></i><span data-bind="name"></span></a>
    <nav id="menu">
      <ul>
        <li><a href="#services">Услуги</a></li>
        <li><a href="#about">О нас</a></li>
        <li><a href="#work">Наша работа</a></li>
        <li><a href="#contacts">Контакты</a></li>
      </ul>
    </nav>
    <a href="#contacts" class="btn sm">Записаться на ремонт</a>
    <button class="burger" id="burger" aria-label="Меню"><i class="fa-solid fa-bars"></i></button>
  </div>
</header>

<!-- ===== HERO ===== -->
<main id="top">
<section class="hero" id="hero">
  <div class="wrap">
    <div class="stripe"></div>
    <h1 data-bind="heroTitle"></h1>
    <p data-bind="heroSubtitle"></p>
    <div class="row">
      <a href="#services" class="btn" data-bind="heroButton"></a>
      <a class="btn ghost" id="heroPhone"><i class="fa-solid fa-phone"></i><span></span></a>
    </div>
  </div>
</section>

<!-- ===== УСЛУГИ ===== -->
<section id="services">
  <div class="wrap">
    <h2 data-bind="servicesTitle"></h2>
    <p class="lead" data-bind="servicesLead"></p>
    <div class="grid" id="servicesGrid"></div>
  </div>
</section>

<!-- ===== ПРЕИМУЩЕСТВА ===== -->
<section id="about">
  <div class="wrap">
    <h2 data-bind="whyTitle"></h2>
    <p class="lead" data-bind="whyLead"></p>
    <div class="why" id="whyGrid"></div>
  </div>
</section>

<!-- ===== ГАЛЕРЕЯ ===== -->
<section id="work">
  <div class="wrap">
    <h2 data-bind="galleryTitle"></h2>
    <p class="lead" data-bind="galleryLead"></p>
    <div class="gallery" id="galleryGrid"></div>
  </div>
</section>

<!-- ===== КОНТАКТЫ ===== -->
<section id="contacts" style="background:var(--bg2);border-top:1px solid var(--line)">
  <div class="wrap contacts">
    <div>
      <h2 data-bind="contactsTitle"></h2>
      <p class="lead" data-bind="contactsLead"></p>
      <ul class="info" id="contactList"></ul>
    </div>
    <div class="cta" id="ctaBox"></div>
  </div>
</section>
</main>

<footer><div class="wrap" id="footerText"></div></footer>

<script>
/* =====================================================================
   КОНФИГУРАЦИЯ — меняйте только этот объект, HTML/CSS трогать не нужно
   ===================================================================== */
const SERVICE_DATA = {
  name: "AUTO·FORGE",
  /* Контакты */
  phone: "+7 (900) 123-45-67",
  address: "г. Москва, ул. Промышленная, 12, бокс 4",
  telegram: "https://t.me/example",
  whatsapp: "https://wa.me/79001234567",
  hours: "Ежедневно, 09:00–21:00",
  towPhone: "+7 (900) 765-43-21",           // эвакуатор
  /* Тексты */
  heroTitle: "Профессиональный сервис для вашего автомобиля",
  heroSubtitle: "Диагностика, ремонт и детейлинг в одном месте. Назовём цену до начала работ и дадим гарантию.",
  heroButton: "Узнать стоимость",
  heroImage: "https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1800&q=70",
  servicesTitle: "Услуги и цены",
  servicesLead: "Окончательную стоимость назовём после диагностики.",
  whyTitle: "Почему выбирают нас",
  whyLead: "Работаем так, чтобы к нам возвращались и приводили друзей.",
  galleryTitle: "Наши работы",
  galleryLead: "Примеры автомобилей, которые мы вернули в идеальное состояние.",
  contactsTitle: "Приезжайте или звоните",
  contactsLead: "Запишем на удобное время и подберём мастера под вашу задачу.",
  footerText: "© 2026 AUTO·FORGE. Все права защищены.",
  /* Услуги: title, text, price (число, руб.), image, icon */
  services: [
    { title: "Детейлинг",          text: "Полировка, керамика, химчистка салона. Кузов как с конвейера.", price: 8000,  image: "https://images.unsplash.com/photo-1507136566006-cfc505b114fc?auto=format&fit=crop&w=800&q=70" },
    { title: "Ремонт двигателя",   text: "Капитальный и текущий ремонт, замена ГРМ, устранение течей.",   price: 15000, image: "https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?auto=format&fit=crop&w=800&q=70" },
    { title: "ТО и диагностика",   text: "Замена масла и фильтров, компьютерная диагностика всех систем.", price: 2500,  image: "https://images.unsplash.com/photo-1632823471565-1ecdf5c6da05?auto=format&fit=crop&w=800&q=70" },
    { title: "Шиномонтаж",         text: "Сезонная замена, балансировка, ремонт проколов и дисков.",       price: 1800,  image: "https://images.unsplash.com/photo-1486006920555-c77dcf18193c?auto=format&fit=crop&w=800&q=70" }
  ],
  /* Преимущества: icon (FontAwesome), title, text */
  advantages: [
    { icon: "fa-shield-halved", title: "Гарантия на работу",     text: "Письменная гарантия до 12 месяцев на выполненный ремонт." },
    { icon: "fa-screwdriver-wrench", title: "Современное оборудование", text: "Диагностические сканеры и подъёмники для легковых и коммерческих авто." },
    { icon: "fa-user-gear",     title: "Опытные мастера",        text: "Специалисты со стажем от 8 лет и сертификатами производителей." }
  ],
  /* Галерея: src, label */
  gallery: [
    { src: "https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=800&q=70", label: "Детейлинг" },
    { src: "https://images.unsplash.com/photo-1544829099-b9a0c07fad1a?auto=format&fit=crop&w=800&q=70",   label: "Полировка" },
    { src: "https://images.unsplash.com/photo-1503736334956-4c8f8e92946d?auto=format&fit=crop&w=800&q=70", label: "В боксе" },
    { src: "https://images.unsplash.com/photo-1520340356584-f9917d1eea6f?auto=format&fit=crop&w=800&q=70", label: "Ремонт" },
    { src: "https://images.unsplash.com/photo-1619642751034-765dfdf7c58e?auto=format&fit=crop&w=800&q=70", label: "Мойка и уход" },
    { src: "https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?auto=format&fit=crop&w=800&q=70", label: "Результат" }
  ]
};

/* =====================================================================
   РЕНДЕР — наполняет страницу данными из SERVICE_DATA
   ===================================================================== */
const D = SERVICE_DATA;
const $ = s => document.querySelector(s);
const tel = p => "tel:" + p.replace(/[^\d+]/g, "");
// Экранирование, чтобы данные из конфига не ломали разметку
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "от " + n.toLocaleString("ru-RU") + " руб.";

// Простые текстовые поля
document.title = D.name + " — автосервис и детейлинг";
document.querySelectorAll("[data-bind]").forEach(el => el.textContent = D[el.dataset.bind] ?? "");
$("#hero").style.setProperty("--hero", `url("${D.heroImage}")`);
$("#heroPhone").href = tel(D.phone);
$("#heroPhone span").textContent = D.phone;
$("#footerText").textContent = D.footerText;

// Услуги
$("#servicesGrid").innerHTML = D.services.map(s => `
  <article class="card">
    <img src="${esc(s.image)}" alt="${esc(s.title)}" loading="lazy">
    <div class="body">
      <h3>${esc(s.title)}</h3>
      <p>${esc(s.text)}</p>
      <div class="foot">
        <span class="price">${money(s.price)}</span>
        <a class="btn sm" href="#contacts" data-order="${esc(s.title)}">Заявка</a>
      </div>
    </div>
  </article>`).join("");

// Преимущества
$("#whyGrid").innerHTML = D.advantages.map(a => `
  <div><i class="fa-solid ${esc(a.icon)}"></i><h3>${esc(a.title)}</h3><p>${esc(a.text)}</p></div>`).join("");

// Галерея
$("#galleryGrid").innerHTML = D.gallery.map(g => `
  <div><img src="${esc(g.src)}" alt="${esc(g.label)}" loading="lazy"><span>${esc(g.label)}</span></div>`).join("");

// Контакты
$("#contactList").innerHTML = `
  <li><i class="fa-solid fa-location-dot"></i><div>${esc(D.address)}</div></li>
  <li><i class="fa-solid fa-phone"></i><div><a href="${tel(D.phone)}">${esc(D.phone)}</a></div></li>
  <li><i class="fa-solid fa-clock"></i><div>${esc(D.hours)}</div></li>`;
$("#ctaBox").innerHTML = `
  <a class="btn" href="${esc(D.telegram)}" target="_blank" rel="noopener"><i class="fa-brands fa-telegram"></i>Написать в Telegram</a>
  <a class="btn ghost" href="${esc(D.whatsapp)}" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i>Написать в WhatsApp</a>
  <a class="btn sos" href="${tel(D.towPhone)}"><i class="fa-solid fa-truck-pickup"></i>Вызвать эвакуатор</a>`;

// Заглушка для недоступных фото: тёмный блок вместо битой картинки
document.querySelectorAll("img").forEach(img => img.addEventListener("error", () => { img.style.visibility = "hidden"; }));

/* =====================================================================
   БУРГЕР-МЕНЮ
   ===================================================================== */
const burger = $("#burger"), menu = $("#menu");
const setMenu = open => {
  menu.classList.toggle("open", open);
  burger.querySelector("i").className = open ? "fa-solid fa-xmark" : "fa-solid fa-bars";
  burger.setAttribute("aria-expanded", open);
};
burger.addEventListener("click", () => setMenu(!menu.classList.contains("open")));
menu.querySelectorAll("a").forEach(a => a.addEventListener("click", () => setMenu(false)));
</script>
</body>
</html>
